spring.application.name= msUsers
server.port=8082

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:33062/user_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin_password

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.docker.compose.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.user=root
spring.flyway.password=admin_password

logging.level.com.zaxxer.hikari=DEBUG

spring.datasource.hikari.maximum-pool-size=5

spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

spring.datasource.hikari.keepalive-time=30000

logging.level.org.flywaydb=DEBUG